<style>
  html { scroll-behavior: smooth; }
  .app-nav {
    position: sticky;
    top: 0;
    z-index: 80;
    background: rgba(255, 255, 255, .96);
    border-bottom: 1px solid #dbe4f0;
    box-shadow: 0 4px 18px rgba(15, 23, 42, .06);
    backdrop-filter: saturate(180%) blur(10px);
  }
  .app-nav-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .app-brand {
    color: #1e3a8a;
    font-weight: 800;
    font-size: 15px;
    text-decoration: none;
    white-space: nowrap;
    margin-right: 4px;
  }
  .app-links { display: flex; gap: 8px; flex-wrap: wrap; }
  .app-link {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    min-height: 38px;
    padding: 8px 13px;
    border-radius: 10px;
    border: 1px solid transparent;
    color: #475569;
    background: #f8fafc;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    transition: background .18s, color .18s, border-color .18s, transform .18s, box-shadow .18s;
  }
  .app-link:hover {
    color: #1d4ed8;
    background: #eff6ff;
    border-color: #bfdbfe;
    transform: translateY(-1px);
  }
  .app-link.active {
    color: #fff;
    background: linear-gradient(120deg, #1e3a8a, #2563eb);
    border-color: #2563eb;
    box-shadow: 0 5px 14px rgba(37, 99, 235, .28);
  }
  .app-icon {
    width: 17px;
    height: 17px;
    flex: 0 0 17px;
    display: block;
  }
  .app-icon svg {
    width: 100%;
    height: 100%;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  @media (max-width: 720px) {
    .app-nav-inner { align-items: flex-start; padding: 9px 12px; gap: 8px; }
    .app-brand { display: none; }
    .app-links { width: 100%; gap: 6px; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; }
    .app-link { flex: 0 0 auto; min-height: 36px; padding: 7px 10px; font-size: 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .app-link { transition: none; }
    .app-link:hover { transform: none; }
  }
</style>
<nav class="app-nav" aria-label="页面导航">
  <div class="app-nav-inner">
    <a class="app-brand" href="{{ url_for('index') }}">发货额度看板</a>
    <div class="app-links">
      <a class="app-link{% if nav_active == 'dashboard' %} active{% endif %}" href="{{ url_for('index') }}"{% if nav_active == 'dashboard' %} aria-current="page"{% endif %}>
        <span class="app-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c3 3.5 3 14 0 18M12 3c-3 3.5-3 14 0 18"></path></svg></span>
        俄罗斯 / 墨西哥
      </a>
      <a class="app-link{% if nav_active == 'shared' %} active{% endif %}" href="{{ url_for('shared_page') }}"{% if nav_active == 'shared' %} aria-current="page"{% endif %}>
        <span class="app-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"></ellipse><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"></path></svg></span>
        公共数据
      </a>
      <a class="app-link{% if nav_active == 'thailand2' %} active{% endif %}" href="{{ url_for('thailand2_page') }}"{% if nav_active == 'thailand2' %} aria-current="page"{% endif %}>
        <span class="app-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16"></path><path d="M8 16v-5M12 16V8M16 16v-3"></path></svg></span>
        泰国2TAIZHONG HESHENG
      </a>
    </div>
  </div>
</nav>
